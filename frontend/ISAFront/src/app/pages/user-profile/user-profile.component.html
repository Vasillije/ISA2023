<div class="backgroundcol" style="display: flex;">
    <div class="register">
        <h1 style="margin-bottom: 25px; margin-top: -50px;"><b>USER INFO</b></h1>
        <form #updateForm="ngForm" (ngSubmit)="update(updateForm.value)">
            <mat-form-field appearance="fill">
                <mat-label>Password</mat-label>
                <input matInput type="password" name="password" [(ngModel)]="user.password">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Name</mat-label>
                <input matInput type="text" name="name" [(ngModel)]="user.name">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Surname</mat-label>
                <input matInput type="text" name="surname" [(ngModel)]="user.surname">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>City</mat-label>
                <input matInput type="text" name="city" [(ngModel)]="user.town">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Country</mat-label>
                <input matInput type="text" name="country" [(ngModel)]="user.country">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Phone number</mat-label>
                <input matInput type="text" name="phoneNumber" [(ngModel)]="user.phoneNumber">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Profession</mat-label>
                <input matInput type="text" name="profession" [(ngModel)]="user.profession">
            </mat-form-field>
            <mat-form-field appearance="fill">
                <mat-label>Company info</mat-label>
                <input matInput type="text" name="companyInfo" [(ngModel)]="user.companyInfo">
            </mat-form-field>
            <button mat-button type="submit" (click)="update(updateForm.value)">Submit</button>
        </form>
    </div>
    
    <div class="user-info" style="margin-left: 20px; flex: 1;">
        <div *ngIf="role == 'ROLE_USER'">
            <div class="user-info" style="flex: 1; max-width: 300px; margin-left: 20px;">
                <div style="display: flex; align-items: center; margin-bottom: 15px;">
                    <label style="margin-right: 10px;" class="label">PENALTY POINTS:</label>
                    <mat-form-field appearance="fill" style="flex: 1;">
                        <input matInput type="text" [value]="user.penaltyPoints" readonly>
                    </mat-form-field>  
                </div>
                <div style="display: flex; align-items: center;">
                    <label style="margin-right: 10px;" class="label">ROLE:</label>
                    <mat-form-field appearance="fill" style="flex: 1;">
                        <input matInput [value]="role" readonly>
                    </mat-form-field>
                </div>
                
                <button mat-button class="button" (click)="viewScheduledAppointments()">View scheduled appointments</button>
            </div>
        </div>
    </div>
