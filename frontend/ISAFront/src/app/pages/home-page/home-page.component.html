<div class="view">
    <div class="panel">
        <h1>Companies</h1>

        <div class="form">
            <form  #companyForm="ngForm" (ngSubmit)="search(companyForm.value)"> 
                <div class="formField">
                    <mat-form-field appearance="fill">
                        <mat-label>Search by name</mat-label>
                        <input matInput type="text"  name="name" ngModel>
                    </mat-form-field>
                    <mat-form-field appearance="fill">
                        <mat-label>Search by town</mat-label>
                        <input matInput type="text"  name="town" ngModel>
                    </mat-form-field>
                    <button mat-button type="submit">Search</button>
                </div>
            </form>    
        </div>

        <mat-accordion>
            <div *ngFor="let c of companies">
                <mat-expansion-panel (opened)="isOpen = true"
                                     (closed)="isOpen = false">
                    <mat-expansion-panel-header>
                        <mat-panel-title>{{c.name }} </mat-panel-title>
                        <mat-panel-description>{{c.description}} </mat-panel-description>
                    </mat-expansion-panel-header>
                    <p>Ovde ce ici oprema</p>
                </mat-expansion-panel>
            </div>
        </mat-accordion>
    </div>
   
</div>
