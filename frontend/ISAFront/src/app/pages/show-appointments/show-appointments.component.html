<div class="background" style="background: linear-gradient(to bottom, rgb(221, 234, 250), rgb(255, 255, 255));">
    <div class="center">
        <h1><b>PICK PREDEFINED APPOINTMENT</b></h1>
        <div *ngFor="let a of appointments">
            <div  *ngIf="a.isBooked==false">
        <mat-card>
            <mat-card-content>
                    Start : {{a.startDateAndTime}} <br> Finish {{a.finishDateAndTime}}
                    <button class='dugme' (click)="showEquipment()">Pick appointment</button>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
    </div>
</div>
