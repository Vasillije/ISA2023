<div class="backgroundcol">
<div class="register">
    <h1 style="margin-bottom: 25px; margin-top: -50px;"><b>REGISTER</b></h1>
    <form #registerForm="ngForm" (ngSubmit)="register(registerForm.value)">
        <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput type="text" id="email" name="email" ngModel>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Password</mat-label>
            <input matInput type="password" id="password" name="password" ngModel>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Retype password</mat-label>
            <input matInput type="password" id="retypedpassword" name="retypedpassword" ngModel>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput type="text" id="name" name="name" ngModel>
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Surname</mat-label>
            <input matInput type="text" id="surname" name="surname" ngModel>
        </mat-form-field>
        <button mat-button type="submit">Submit</button>
    </form>
</div>
</div>
