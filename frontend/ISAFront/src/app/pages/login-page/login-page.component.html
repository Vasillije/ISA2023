<h1>Login</h1>
<form (ngSubmit)="login()">
    <mat-form-field appearance="fill">
        <mat-label>Username</mat-label>
        <input matInput type="text">
    </mat-form-field>
    <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password">
    </mat-form-field>
    <button mat-button type="submit">Submit</button>
</form>
