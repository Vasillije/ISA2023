<div class="backgroundcol">
    <div class="center">
        <form #appointmentForm="ngForm" class="form">
            <h1 class="title"><b>MAKE COMPLAINT</b></h1>
            <button class="menu" mat-button [matMenuTriggerFor]="menu">{{ selectedMenuItem || 'Menu' }}</button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item *ngFor="let company of companies" (click)="changeMenu(company.name)">Company: {{company.name}}</button>
              <button mat-menu-item *ngFor="let admin of companyAdminsList" (click)="changeMenu(admin.name)">Admin: {{admin}}</button>
            </mat-menu>
            <textarea matInput name="complaint" class="complaintText"></textarea>
          </form>
    </div>
</div>
